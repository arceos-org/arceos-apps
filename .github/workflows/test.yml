name: Test CI

on: [push, pull_request]

env:
  qemu-version: 10.2.1

jobs:
  app-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # TODO: add loongarch64, x86_64 after supports it
        arch: [riscv64, aarch64]
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: nightly
        components: rust-src
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: cargo-bin-cache
        cache-targets: false
    - run: cargo install cargo-binutils
    - uses: arceos-org/setup-qemu@v1
      with:
        version: ${{ env.qemu-version }}
        arch_list: x86_64,aarch64,riscv64,loongarch64
    - uses: arceos-org/setup-musl@v1
      with:
        arch: ${{ matrix.arch }}
    - name: Run app tests
      run: |
        ./scripts/get_deps.sh
        make disk_img
        make test ARCH=${{ matrix.arch }}
